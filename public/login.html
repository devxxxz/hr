<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Hackers Residence | HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">HR</span>
        <h1>HACKERS RESIDENCE</h1>
        <p class="tagline">&gt; authorized access only_</p>
      </div>

      <form id="loginForm" autocomplete="off">
        <label>
          <span>Username</span>
          <input type="text" id="username" name="username" placeholder="username" required autocomplete="off" />
        </label>
        <label>
          <span>Password</span>
          <input type="password" id="password" name="password" placeholder="••••••••••" required autocomplete="off" />
        </label>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-glow">
          <span>Access Terminal</span>
        </button>

        <p id="statusMsg" class="status"></p>
      </form>

      <footer>
        <span class="dot"></span> system online
      </footer>
    </div>
  </main>

  <script src="/js/bg.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
